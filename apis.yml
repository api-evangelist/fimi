aid: fimi
name: FIMI Technology
description: >-
  FIMI Technology Ltd. (Beijing FIMI Technology Co., Ltd. / Shenzhen FIMI Robot Technology Co., Ltd.)
  is a consumer aerial-imaging hardware manufacturer founded in May 2014 as a member of the Xiaomi
  ecosystem. FIMI designs and sells affordable camera drones, handheld gimbal cameras, and smartphone
  gimbals, with a product lineup that includes the X8 series (X8 SE, X8 Pro, X8 Tele, X8T enterprise),
  the compact Mini 3, the Manta VTOL fixed-wing drone, and the PALM series gimbal cameras. The company
  holds hundreds of patents across flight control, wireless transmission links, mechatronic design,
  gimbal image-stabilization, and computer vision. FIMI is a portfolio company of Qiming Venture
  Partners. This is a consumer-electronics company with no public developer program, API, SDK, or
  developer portal; this profile captures its public identity and domain-security posture.
